name: ci-cd
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Unit tests and package
        run: mvn -B clean verify
      - name: Dependency vulnerability scan
        if: ${{ env.NVD_API_KEY != '' }}
        run: mvn -B org.owasp:dependency-check-maven:check -DfailBuildOnCVSS=7 -DnvdApiKey=$NVD_API_KEY
      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3
      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-war
          path: target/employee-management.war
          retention-days: 14

  deploy-azure-vm:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test-scan
    runs-on: ubuntu-latest
    environment: uat
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: employee-management-war
          path: artifact
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts
      - name: Copy artifact and deploy
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          scp -i ~/.ssh/deploy_key artifact/employee-management.war "$VM_USER@$VM_HOST:/tmp/employee-management.war"
          ssh -i ~/.ssh/deploy_key "$VM_USER@$VM_HOST" 'sudo /usr/local/sbin/deploy-employee-management'
