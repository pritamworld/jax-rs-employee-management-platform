services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: employee-oracle
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-change_this_local_only}
      APP_USER: ${DB_USERNAME:-employee_app}
      APP_USER_PASSWORD: ${DB_PASSWORD:-change_me_local}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 20
  app:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      APP_ENV: local
      DB_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      DB_USERNAME: ${DB_USERNAME:-employee_app}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_local}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-secret-to-32-chars-minimum}
      JWT_ISSUER: employee-management
      JWT_TTL_MINUTES: 30
    ports:
      - "8080:8080"
volumes:
  oracle-data:
