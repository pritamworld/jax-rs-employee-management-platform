# Application
app.name=employee-management
app.version=1.0.0

# Environment
app.environment=${APP_ENV:local}

# Database defaults
db.driver=oracle.jdbc.OracleDriver

# Pool settings
db.pool.minimumIdle=2
db.pool.maximumPoolSize=10
db.pool.connectionTimeout=30000

# JWT
jwt.issuer=employee-management
jwt.ttlMinutes=30
server.port=8080

# API
api.base.path=/api/v1

# Logging
logging.level=INFO